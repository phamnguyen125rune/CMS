# Application Information
spring.application.name=CMS
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CMS}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate=DEBUG

CMS.jwt.base64-secret=${JWT_SECRET:+TM0TNDBN4J/OimjioXUgFBR1pIgYqofyMrZvM2AaWaoVbbJadp69v7wMAL8tXP+lpzkWms1jIK1KZ7IrwG1RA==}
CMS.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:8640000}
CMS.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:8640000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.upload.dir=CMS/uploads/avatars
media.upload-dir=CMS/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

CMS.default-admin.email=${DEFAULT_ADMIN_EMAIL:cms@gmail.com}
CMS.default-admin.password=${DEFAULT_ADMIN_PASSWORD:123456}
CMS.default-admin.phone=${DEFAULT_ADMIN_PHONE:123456789}

# Google OAuth2 Config for Gmail
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/gmail/oauth/callback}
google.refresh.token=${GOOGLE_REFRESH_TOKEN:}

# Google OAuth2 / OpenID Connect (User Authentication)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

CMS.oauth2.frontend-success-url=${OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:3000/oauth/callback}
CMS.oauth2.frontend-failure-url=${OAUTH2_FRONTEND_FAILURE_URL:http://localhost:3000/login}
CMS.oauth2.default-role=${OAUTH2_DEFAULT_ROLE:Customer}
CMS.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
